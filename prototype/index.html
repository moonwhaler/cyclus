<meta charset="utf-8">
<title>Cyclus Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: interview stage = control panel beside a 390×844 iPhone; on phones the app stacks above the panel.
   Tokens mirror DESIGN_SPEC §5.1 (contrast-verified). German first, English second. */
:root{
  --bg:#FBF8F5; --surface:#FFFFFF; --surface2:#F3EEEA; --ink:#1D1A1C; --ink2:#6B6267; --line:#E6DED8;
  --period:#B3264E; --pre:#6A4C9C; --mid:#8A7F76; --fertile:#13706F; --success:#2E7D5B; --warning:#8F5600;
  --onAccent:#FFFFFF; --stage:#EEE7E1; --bezel:#1D1A1C; --glass:rgba(255,255,255,.66); --glassLine:rgba(29,26,28,.08);
  --scrim:rgba(29,26,28,.34); --shadow:0 10px 40px rgba(60,30,40,.18); --toastBtn:#FF9DB3;
  --f-text:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-round:ui-rounded,"SF Pro Rounded","Nunito",-apple-system,system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141114; --surface:#1E1A1E; --surface2:#29242A; --ink:#F4EFF1; --ink2:#ABA1A6; --line:#3A3438;
  --period:#FF8FA8; --pre:#BBA6EC; --mid:#8F858A; --fertile:#5FD0C8; --success:#6FCF9F; --warning:#F2B65A;
  --onAccent:#141114; --stage:#0B090B; --bezel:#2E292E; --glass:rgba(34,29,34,.66); --glassLine:rgba(255,255,255,.08);
  --scrim:rgba(0,0,0,.55); --shadow:0 10px 40px rgba(0,0,0,.5); --toastBtn:#B3264E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141114; --surface:#1E1A1E; --surface2:#29242A; --ink:#F4EFF1; --ink2:#ABA1A6; --line:#3A3438;
  --period:#FF8FA8; --pre:#BBA6EC; --mid:#8F858A; --fertile:#5FD0C8; --success:#6FCF9F; --warning:#F2B65A;
  --onAccent:#141114; --stage:#0B090B; --bezel:#2E292E; --glass:rgba(34,29,34,.66); --glassLine:rgba(255,255,255,.08);
  --scrim:rgba(0,0,0,.55); --shadow:0 10px 40px rgba(0,0,0,.5); --toastBtn:#B3264E; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--stage);color:var(--ink);font-family:var(--f-text);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px;
  hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--period);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-round);font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
.stage{display:flex;gap:40px;justify-content:center;align-items:flex-start;max-width:1120px;margin:0 auto}
.panel{flex:1 1 340px;max-width:400px;min-width:0;display:flex;flex-direction:column;gap:22px;padding-top:12px}
.panel h1{font-family:var(--f-round);font-weight:800;font-size:30px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.panel h1 span{color:var(--period)}
.panel p{margin:0;color:var(--ink2);max-width:60ch}
.pgroup{display:flex;flex-direction:column;gap:8px}
.plabel{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.pbtns{display:flex;flex-wrap:wrap;gap:6px}
.pbtn{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px}
.pbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tasks{margin:0;padding-left:20px;color:var(--ink);display:flex;flex-direction:column;gap:6px;font-size:14px}
.tasks li::marker{color:var(--ink2);font-family:var(--f-round);font-weight:700}
.pnote{font-size:12px;color:var(--ink2);border-top:1px solid var(--line);padding-top:12px}

.device{flex:0 0 auto;width:414px;height:868px;border-radius:62px;background:var(--bezel);padding:12px;box-shadow:var(--shadow);position:relative}
.screen{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
@media (max-width:900px){
  .stage{flex-direction:column;align-items:center;gap:24px}
  .panel{max-width:560px;width:100%;order:2}
}
@media (max-width:520px){
  body{padding-block:12px}
  .device{width:100%;max-width:414px;height:min(820px,calc(100svh - 24px));min-height:640px;padding:0;border-radius:28px;background:transparent}
  .screen{border-radius:28px;border:1px solid var(--line)}
}

/* ---------- app chrome ---------- */
.statusbar{height:50px;flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;padding:0 30px 6px 34px;font-weight:600;font-size:15px;position:relative;z-index:5}
.sb-icons{display:flex;gap:6px;align-items:center}
.main{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:0 16px 132px;scrollbar-width:none}
.main::-webkit-scrollbar{display:none}
.navrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 4px}
.navrow > div:first-child{min-width:0}
.navrow .date{font-size:13px;color:var(--ink2);font-weight:500}
.navrow h2{margin:0;font-size:32px;font-weight:700;letter-spacing:-.01em;hyphens:manual}
.navicons{display:flex;gap:8px;flex:0 0 auto}
.iconbtn{width:38px;height:38px;border-radius:999px;display:grid;place-items:center;background:var(--glass);border:1px solid var(--glassLine);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);flex:0 0 auto}
.iconbtn svg{width:19px;height:19px}

.tabbar{position:absolute;left:14px;right:14px;bottom:18px;height:64px;border-radius:32px;display:flex;justify-content:space-around;align-items:center;background:var(--glass);border:1px solid var(--glassLine);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);z-index:20;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink2);min-width:72px;padding:6px 0;border-radius:22px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--period)}
.fab{position:absolute;right:20px;bottom:96px;z-index:21;height:52px;padding:0 20px 0 16px;border-radius:26px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--period);background:var(--glass);border:1px solid var(--glassLine);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);box-shadow:0 8px 24px rgba(0,0,0,.12)}
.fab svg{width:22px;height:22px}

/* ---------- cards & common ---------- */
.card{background:var(--surface);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;width:100%}
.card h3{margin:0;font-size:15px;font-weight:600}
.card p{margin:0;color:var(--ink2);font-size:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.row > *{min-width:0}
.muted{color:var(--ink2)}
.small{font-size:13px}
.tiny{font-size:12px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface2);color:var(--ink);max-width:100%;text-align:left;flex:0 0 auto}
.badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto}
.badge.fert{color:var(--fertile)}
.linkrow{display:flex;justify-content:space-between;align-items:center;padding:12px 2px;font-weight:600;color:var(--period);width:100%;text-align:left}
.foot{font-size:12px;color:var(--ink2);text-align:center;padding:6px 0 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:8px 22px;border-radius:25px;font-weight:700;font-size:16px;text-align:center;line-height:1.2}
.btn.primary{background:var(--period);color:var(--onAccent)}
.btn.secondary{background:var(--surface2);color:var(--ink)}
.btn.block{width:100%}
.btn.small{min-height:38px;font-size:14px;padding:6px 16px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1 1 0;min-width:0;padding:8px 6px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink2);min-height:36px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* ring — container-sized text, max three lines, details live below the ring (spec §6 CycleRing) */
.ringwrap{position:relative;width:min(300px,82%);margin:4px auto 0;aspect-ratio:1;max-width:100%;container-type:inline-size}
.ringwrap svg{width:100%;height:100%;display:block}
.ringinfo{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:44px;height:44px;display:grid;place-items:center;color:var(--ink2);opacity:.75;background:none;border:0}
.ringinfo svg{width:18px;height:18px}
.rlegend{display:flex;flex-direction:column;gap:2px;background:var(--surface);border-radius:14px;padding:6px 0}
.rlegend>div{display:grid;grid-template-columns:52px minmax(0,1fr);gap:14px;align-items:center;padding:9px 14px}
.rlegend svg{width:52px;height:34px}.rlegend b{display:block}
.ringcenter{position:absolute;left:21%;right:21%;top:22%;bottom:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;hyphens:manual;overflow:hidden}
.ringcenter > *{max-width:100%}
.ringcenter .kicker{font-size:13px;color:var(--ink2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ringcenter .big{font-family:var(--f-round);font-weight:800;font-size:40px;line-height:1.05;letter-spacing:-.01em;white-space:nowrap}
.ringcenter .sub{font-size:13px;color:var(--ink2);line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.ringcenter .range{font-family:var(--f-round);font-weight:700;font-size:18px;color:var(--ink);white-space:nowrap}
.under{display:flex;flex-direction:column;align-items:center;gap:10px;margin:2px 0 14px;text-align:center}
.under .ovl{font-size:14px;color:var(--ink);font-weight:600;text-wrap:balance}

/* sheets & pushed screens */
.layer{position:absolute;inset:0;z-index:40;pointer-events:none}
.layer.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .28s}
.layer.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:93%;background:var(--bg);border-radius:24px 24px 0 0;transform:translateY(102%);transition:transform .34s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column}
.layer.open .sheet{transform:none}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:0 0 auto}
.sheethead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 16px 10px;flex:0 0 auto}
.sheethead h3{margin:0;font-size:17px;font-weight:700;text-align:center;flex:1;min-width:0}
.sheethead .x{color:var(--period);font-weight:600;flex:0 0 auto}
.sheetbody{overflow-y:auto;padding:0 16px 28px;display:flex;flex-direction:column;gap:18px;scrollbar-width:none}
.sheetbody::-webkit-scrollbar{display:none}
.push{position:absolute;inset:0;z-index:35;background:var(--bg);transform:translateX(102%);transition:transform .34s cubic-bezier(.3,.9,.3,1);display:flex;flex-direction:column}
.push.open{transform:none}
.pushhead{display:flex;align-items:center;gap:6px;padding:54px 12px 6px;flex:0 0 auto}
.pushhead button{color:var(--period);font-weight:600;display:flex;align-items:center;gap:2px;padding:6px}
.pushbody{flex:1;overflow-y:auto;padding:0 16px 40px;display:flex;flex-direction:column;gap:16px;scrollbar-width:none}
.pushbody::-webkit-scrollbar{display:none}
.pushbody h2{margin:0;font-size:30px;font-weight:700;hyphens:manual}
.sec{display:flex;flex-direction:column;gap:8px}
.sec > .lbl{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);padding:0 4px}
.list{background:var(--surface);border-radius:14px;display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:50px;text-align:left;width:100%}
.li + .li{border-top:1px solid var(--line)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:500}
.li .t span{display:block;font-size:13px;color:var(--ink2)}
.li .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:0 0 auto;color:#fff}
.li .ic svg{width:17px;height:17px}
.switch{width:51px;height:31px;border-radius:16px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.switch[aria-checked="true"]{background:var(--success)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* log sheet */
.lgroup{display:flex;flex-direction:column;gap:10px}
.lgroup > .lbl{font-size:13px;font-weight:600;color:var(--ink2);display:flex;justify-content:space-between;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:500;line-height:1.2;text-align:left;max-width:100%}
.chip[aria-pressed="true"]{background:color-mix(in srgb,var(--period) 14%,var(--surface));border-color:var(--period);color:var(--ink)}
.chip[aria-pressed="true"]::before{content:"✓";font-weight:800;color:var(--period)}
.chip.sugg{border-style:dashed}
.chip.lh[aria-pressed="true"]{background:color-mix(in srgb,var(--fertile) 16%,var(--surface));border-color:var(--fertile)}
.chip.lh[aria-pressed="true"]::before{color:var(--fertile)}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.drop{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:11.5px;font-weight:600;min-height:74px;justify-content:center;line-height:1.15;text-align:center}
.drop svg{width:28px;height:28px;flex:0 0 auto}
.drop[aria-pressed="true"]{border-color:var(--period);background:color-mix(in srgb,var(--period) 12%,var(--surface))}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale button{min-height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-family:var(--f-round);font-weight:700}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.scaleends{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink2)}
.painwrap{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;align-items:center;background:var(--surface);border-radius:14px;padding:12px}
.painwrap svg{width:110px;height:auto}
.region{cursor:pointer;fill:var(--surface2);stroke:var(--line);stroke-width:1.5}
.region.on{fill:color-mix(in srgb,var(--period) 55%,transparent)}
.region.sel{stroke:var(--period);stroke-width:2.5}
input[type=range]{width:100%;accent-color:var(--period)}
.bbt{display:flex;align-items:center;gap:8px}
.bbt input{width:96px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 17px var(--f-round);text-align:center}
textarea,.field{width:100%;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;padding:10px 12px;resize:vertical}
.nothing{display:flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:6px 12px;border-radius:14px;border:1px dashed var(--ink2);font-weight:600;color:var(--ink);text-align:center}
.nothing[aria-pressed="true"]{border-style:solid;border-color:var(--success);color:var(--success)}

/* calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;margin:6px 0 8px}
.calhead h3{margin:0;font-size:20px;font-weight:700}
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:6px}
.day{position:relative;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:4px;border-radius:12px}
.day .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-round);font-weight:700;font-size:15px;position:relative;z-index:1}
.day.out .n{color:var(--ink2);opacity:.45}
.day.bleed .n{background:var(--period);color:var(--onAccent)}
.day.spot .n{box-shadow:inset 0 0 0 2px var(--period);border-radius:50%}
.day.pred .n{border:2px dashed var(--period)}
.day.today .n{outline:2px solid var(--ink);outline-offset:2px}
.day .pp{position:absolute;bottom:9px;left:22%;right:22%;border-bottom:2px dotted var(--pre)}
.day .f{position:absolute;inset:2px 1px 12px;border-radius:12px;background:var(--fertile)}
.day .f.t1{opacity:.16} .day .f.t2{opacity:.32} .day .f.t3{opacity:.5}
.day .fx{position:absolute;inset:2px 1px 12px;border-radius:12px;background-image:radial-gradient(var(--fertile) 1px,transparent 1.2px);background-size:6px 6px;opacity:.55}
.day .mk{position:absolute;top:0;right:3px;font-size:11px;line-height:1;color:var(--fertile);z-index:2}
.day .lg{width:4px;height:4px;border-radius:50%;background:var(--ink2);margin-top:3px}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 12px;font-size:12px;color:var(--ink2);background:var(--surface);border-radius:14px;padding:12px}
.legend span{display:flex;align-items:center;gap:8px;min-width:0}
.sw{width:18px;height:18px;border-radius:50%;flex:0 0 auto}

/* insights */
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border-radius:14px;padding:12px 14px}
.stat .v{font-family:var(--f-round);font-weight:800;font-size:24px}
.stat .k{font-size:12px;color:var(--ink2)}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--f-text);font-size:10px;fill:var(--ink2)}
.heat{display:grid;gap:3px;font-size:11px}
.heat .c{height:20px;border-radius:4px;background:var(--period)}
.heat .h{color:var(--ink2);text-align:center;font-variant-numeric:tabular-nums}
.heat .r{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:4px;hyphens:manual}

/* patterns & outlook */
.pat h3{font-size:16px}
.area{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.06em}
.area i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.adot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.badge.st-consistent{background:color-mix(in srgb,var(--period) 16%,var(--surface))}
.badge.st-early{background:transparent;border:1px dashed var(--ink2)}
.badge.st-stable{color:var(--success)}
.badge.st-none,.badge.st-needs{color:var(--ink2)}
.patfoot{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:2px}
.patfoot details{flex:1;min-width:0}
.patfoot summary{cursor:pointer;color:var(--period);font-weight:600;font-size:13px}
.hidebtn{color:var(--ink2);font-weight:600;flex:0 0 auto}
.fgrid{display:grid;grid-template-columns:92px repeat(7,minmax(0,1fr));gap:3px;font-size:11px;align-items:center;margin-top:4px}
.fh{display:flex;flex-direction:column;align-items:center;color:var(--ink2);font-size:10px;line-height:1.15;hyphens:manual}
.fh b{font-family:var(--f-round);color:var(--ink);font-size:13px}
.fr{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;hyphens:manual;color:var(--ink);padding-right:2px}
.fc{height:18px;border-radius:4px}

/* report preview */
.paper{background:#fff;color:#1D1A1C;border-radius:6px;box-shadow:0 4px 18px rgba(0,0,0,.18);padding:18px 16px;font-size:10px;line-height:1.35;min-height:420px;max-width:100%;display:flex;flex-direction:column;gap:9px}
.paper h4{margin:0;font-size:14px}
.paper table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.paper td{padding:3px 0;border-bottom:1px solid #eee;vertical-align:top}
.paper td:last-child{text-align:right;font-weight:600;padding-left:8px}
.paper .ref{border:1px solid #ccc;border-radius:4px;padding:6px 8px;color:#444}
.paper .mini{display:grid;grid-template-columns:repeat(31,1fr);gap:1px}
.paper .mini i{height:8px;background:#eee;border-radius:1px}
.paper .mini i.b1{background:#e9a7b9}.paper .mini i.b2{background:#c9506f}.paper .mini i.b3{background:#8c1d3c}
.paper .pf{margin-top:auto;border-top:1px solid #ddd;padding-top:5px;color:#666;font-size:8.5px}

/* why sheet */
.step{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding-bottom:16px;position:relative}
.step::before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.step:last-child::before{display:none}
.step .b{width:22px;height:22px;border-radius:50%;background:var(--surface);border:2px solid var(--fertile);display:grid;place-items:center;font-size:11px;color:var(--fertile);font-weight:800;z-index:1}
.step b{display:block}
.step .w{font-family:var(--f-round);font-weight:700;color:var(--fertile)}

/* overlays */
.toast{position:absolute;left:16px;right:16px;bottom:170px;margin:0 auto;width:max-content;max-width:calc(100% - 32px);transform:translateY(20px);opacity:0;z-index:60;background:var(--ink);color:var(--bg);padding:10px 14px 10px 16px;border-radius:14px;font-size:14px;font-weight:600;display:flex;gap:14px;align-items:center;transition:all .25s;pointer-events:none}
.toast.show{opacity:1;transform:none;pointer-events:auto}
.toast button{color:var(--toastBtn);font-weight:700;flex:0 0 auto}
.lock,.onb{position:absolute;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px 28px 40px;text-align:center}
.glyph{width:76px;height:76px;border-radius:22px;background:var(--period);display:grid;place-items:center;color:#fff}
.glyph svg{width:46px;height:46px}
.onb{justify-content:flex-start;text-align:left;align-items:stretch;gap:18px;padding-top:70px;overflow-y:auto}
.onb h2{font-size:28px;line-height:1.15;margin:0;font-weight:800;font-family:var(--f-round);text-wrap:balance;hyphens:manual}
.onb p{margin:0;color:var(--ink2)}
.onb .grow{flex:1}
.onb .dots{display:flex;gap:6px;justify-content:center}
.onb .dots i{width:6px;height:6px;border-radius:3px;background:var(--line)}
.onb .dots i.on{width:18px;background:var(--period)}
.promise{display:flex;flex-direction:column;gap:14px}
.promise div{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;align-items:center}
.promise svg{width:28px;height:28px;color:var(--period)}
.bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--period);width:0;transition:width 1.2s ease}
.faceid{width:64px;height:64px;color:var(--period)}
@media (prefers-reduced-motion: reduce){
  .sheet,.push,.scrim,.toast,.switch,.switch::after,.bar i{transition:none!important}
}

  whyBody:{de:'Jedes Signal, das du einträgst, verbessert die Schätzung. LH-Tests und Temperatur grenzen sie am stärksten ein. Mit jedem Zyklus lernt Cyclus deinen persönlichen Rhythmus besser kennen.',en:'Each signal you log updates the estimate. LH tests and temperature narrow it the most. Cyclus learns your personal timing from every cycle.'},
  whyFoot:{de:'Die Schätzung kombiniert Zyklusverlauf, LH-Tests, Ausfluss und Temperatur. Sie kann falsch sein, besonders bei unregelmäßigen Zyklen. Nicht zur Verhütung geeignet.',en:'Estimates combine your cycle history, LH tests, discharge and temperature. They can be wrong, especially with irregular cycles. Not for birth control.'},
  // method
  methodT:{de:'So funktionieren Prognosen',en:'How predictions work'},
  method:{de:['Cyclus schaut auf die Länge deiner letzten Zyklen, neuere zählen mehr. Es zeigt einen Bereich, in dem deine nächste Periode etwa 8 von 10 Mal beginnt.','Mit wenigen Zyklen ist der Bereich absichtlich breit. Er wird enger, je mehr du einträgst. Ungewöhnlich lange Zyklen, etwa durch einen vergessenen Eintrag, fragt Cyclus nach, statt sie still mitzuzählen.','Alles wird auf deinem iPhone berechnet. Cyclus erhält deine Daten nie.'],
          en:['Cyclus looks at the length of your recent cycles, counting the newest ones more. It shows a range where your next period is likely to start, about 8 times out of 10.','With few cycles the range is wide on purpose. It narrows as you log more. Unusually long cycles, for example from a missed log, are asked about instead of silently counted.','Everything is calculated on your iPhone. Cyclus never receives your data.']},

  noticeT:{de:'Bevor du startest',en:'Before you start'}, noticeB:{de:'Bitte lies das in Ruhe. Es ist wichtig.',en:'Please read this carefully. It matters.'},
  nt1:{de:'Keine Verhütung.',en:'Not birth control.'}, nt1s:{de:'Cyclus ist kein Verhütungsmittel. Verlass dich nie auf Cyclus, um eine Schwangerschaft zu vermeiden. Auch an Tagen, die Cyclus als wenig oder nicht fruchtbar zeigt, kannst du schwanger werden. Wenn du nicht schwanger werden willst, verhüte.',en:'Cyclus is not a contraceptive. Never rely on Cyclus to avoid pregnancy. You can get pregnant even on days Cyclus shows as low or no fertility. If you don’t want to get pregnant, use contraception.'},
  nt2:{de:'Nur Schätzungen.',en:'Estimates only.'}, nt2s:{de:'Prognosen und fruchtbare Tage sind statistische Schätzungen aus deinen Einträgen. Sie können falsch sein, besonders bei unregelmäßigen Zyklen, nach hormoneller Verhütung, in der Stillzeit oder bei Krankheit.',en:'Forecasts and fertile days are statistical estimates from what you enter. They can be wrong, especially with irregular cycles, after hormonal birth control, while breastfeeding or when ill.'},
  nt3:{de:'Kein Medizinprodukt.',en:'Not a medical device.'}, nt3s:{de:'Cyclus stellt keine Diagnosen und ersetzt keine ärztliche Beratung. Bei Fragen oder Beschwerden wende dich an deine Ärztin oder deinen Arzt.',en:'Cyclus does not diagnose anything and does not replace medical advice. For questions or symptoms, talk to your healthcare provider.'},
  nt4:{de:'Deine Entscheidung.',en:'Your decision.'}, nt4s:{de:'Was du mit diesen Angaben machst, entscheidest du selbst. Der Entwickler haftet nicht für die Folgen solcher Entscheidungen, insbesondere nicht für eine ungeplante oder eine ausbleibende Schwangerschaft. Das gilt nicht bei Vorsatz oder grober Fahrlässigkeit, bei Verletzung von Leben, Körper oder Gesundheit und soweit das Produkthaftungsgesetz gilt.',en:'What you do with this information is your decision. The developer is not liable for the consequences of such decisions, in particular for an unplanned pregnancy or for not getting pregnant. This does not apply to intent or gross negligence, to injury to life, body or health, or where product liability law applies.'},

    return {days:Array.from({length:7},(_,i)=>TODAY+i), rows:list, n:cyc.length};
  })();
  FC.set(key,res); return res;
}

/* ============ view model ============ */
function vm(){
  const pred = predict();
  if (!pred){ LEARN = null; LEARN_KEY = S.rev; }
  const paused = !!S.episode;
  const v = {pred, paused, starts: pred? pred.starts : []};
  if (!pred) return v;
  if (LEARN_KEY!==S.rev){ LEARN = learnFromHistory(pred); LEARN_KEY = S.rev; }
  v.cd = TODAY - pred.last + 1;
  v.inPeriod = periodDays(pred.last).includes(TODAY) || (isBleed(S.logs.get(TODAY)) && TODAY-pred.last<8);
  if (v.inPeriod){ const pd = periodDays(pred.last); v.periodDay = pd.indexOf(TODAY)+1 || v.cd; }
  v.status = paused ? 'paused' : v.inPeriod ? 'inPeriod' : TODAY < pred.lo-7 ? 'between' : TODAY < pred.lo ? 'pre' : TODAY <= pred.hi ? 'expected' : 'later';
  v.fertOn = !paused && (S.mode==='conceive' || S.showFertTrack);
  if (v.fertOn) v.fert = fertility(pred);
  return v;
}

/* ============ ring ============ */
function ringSVG(v){
  const C=150, R=118, R2=137;
  const pol = (r,a) => [C + r*Math.cos(a*Math.PI/180), C + r*Math.sin(a*Math.PI/180)];
  const arc = (r,a0,a1) => { const [x0,y0]=pol(r,a0),[x1,y1]=pol(r,a1); return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${a1-a0>180?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`; };
  if (!v.pred) return `<svg viewBox="0 0 300 300" aria-hidden="true"><path d="${arc(R,135,405)}" stroke="var(--mid)" stroke-opacity=".3" stroke-width="18" fill="none" stroke-linecap="round"/></svg>`;
  const p = v.pred;
  const N = Math.max(p.hi - p.last + 1, v.cd + 2, 28);
  const per = 270/N;
  const bleed = new Set(periodDays(p.last));
  let segs='', outer='';
  for (let cd=1; cd<=N; cd++){
    const day = p.last+cd-1;
    const a0 = 135 + (cd-1)*per + 0.7, a1 = 135 + cd*per - 0.7;
    let col='var(--mid)', op=.32, dash='';
    if (bleed.has(day)) { col='var(--period)'; op=1; }
    else if (!v.paused && day>=p.lo-7 && day<p.lo) { col='var(--pre)'; op=.85; dash='stroke-dasharray="2 3.2"'; }
    const fd = v.fertOn && v.fert ? v.fert.days[cd-1] : null;
    if (fd && fd.tier>0 && !bleed.has(day)) { col='var(--fertile)'; op=[0,.35,.65,1][fd.tier]; dash=''; }
    segs += `<path d="${arc(R,a0,a1)}" stroke="${col}" stroke-opacity="${op}" stroke-width="18" fill="none" ${dash}/>`;
  }
  if (!v.paused){
    const a0 = 135 + (p.lo-p.last)*per, a1 = 135 + (p.hi-p.last+1)*per;
    outer = `<path d="${arc(R2,a0,Math.min(a1,405))}" stroke="var(--period)" stroke-width="3" fill="none" stroke-dasharray="5 4" stroke-linecap="round"/>`;
    if (v.fertOn && v.fert){
      const ao = 135 + (v.fert.mapD-0.5)*per; const [ox,oy]=pol(R2,ao);
      const solid = v.fert.status!=='predicted';
      outer += `<circle cx="${ox}" cy="${oy}" r="7" fill="var(--bg)" stroke="var(--fertile)" stroke-width="2" ${solid?'':'stroke-dasharray="2.5 2"'}/><circle cx="${ox}" cy="${oy}" r="2.6" fill="var(--fertile)"/>`;
    }
  }
  const [kx,ky]=pol(R,Math.min(135 + (v.cd-0.5)*per,404));
  return `<svg viewBox="0 0 300 300" aria-hidden="true">${segs}${outer}<circle cx="${kx}" cy="${ky}" r="13" fill="var(--ink)" stroke="var(--bg)" stroke-width="4"/></svg>`;
}
// Ring text never wraps the big line: shrink to fit (min 18px), sub lines clamp at two.
function fitRing(){
  const big = app.querySelector('.ringcenter .big'); if (!big) return;
  const box = big.parentElement; let size = parseFloat(big.dataset.max || 40);
  big.style.fontSize = size+'px';
  while (size>18 && (big.scrollWidth > box.clientWidth || box.scrollHeight > box.clientHeight)){ size -= 1; big.style.fontSize = size+'px'; }
}

function ringLabel(v){

function renderCalendar(){
  const v = vm(); const [y,m] = S.calMonth;
  const first = D(y,m,1);
  const wd = (asDate(first).getUTCDay()+6)%7;
  const bleed = new Set(); v.starts.forEach(s=>periodDays(s).forEach(d=>bleed.add(d)));
  const cells=[];
  for (let i=0;i<42;i++){
    const day = first - wd + i; const dt = asDate(day); const inMonth = dt.getUTCMonth()===m-1;
    if (i>=35 && asDate(first-wd+35).getUTCMonth()!==m-1) break;
    const l = S.logs.get(day); const cls=['day']; let extra='';
    if (!inMonth) cls.push('out');
    if (bleed.has(day)) cls.push('bleed'); else if (l && l.flow==='spotting') cls.push('spot');
    const isPred = v.pred && !v.paused && day>=v.pred.lo && day<=v.pred.hi && day>TODAY && !bleed.has(day);
    if (isPred) cls.push('pred');
    if (v.pred && !v.paused && day>=v.pred.lo-7 && day<v.pred.lo && day>=TODAY) extra += '<span class="pp"></span>';
    if (v.fertOn && v.fert){
      const cd = day - v.fert.cs + 1; const fd = cd>=1 ? v.fert.days[cd-1] : null;
      if (fd && fd.tier>0 && !bleed.has(day)) extra += `<span class="f t${fd.tier}"></span>${fd.tier>=2?'<span class="fx"></span>':''}`;
      if (cd===v.fert.mapD) extra += `<span class="mk">◎</span>`; else if (fd && fd.tier===3) extra += `<span class="mk">✦</span>`;
    }
    if (day===TODAY) cls.push('today');
    const logged = l && (l.symptoms.length || l.mood || l.lh || l.mucus || l.note);
    const lbl = `${F.long.format(dt)}${bleed.has(day)?t('aPeriod'):''}${isPred?t('aPred'):''}${logged?t('aLogged'):''}`;
    cells.push(`<button class="${cls.join(' ')}" data-act="day" data-v="${day}" aria-label="${lbl}">${extra}<span class="n">${dt.getUTCDate()}</span>${logged?'<span class="lg"></span>':''}</button>`);
  }
  const legend = `<div class="legend">
    <span><i class="sw" style="background:var(--period)"></i>${t('lgPeriod')}</span>
    <span><i class="sw" style="border:2px dashed var(--period)"></i>${t('lgPred')}</span>
    <span><i class="sw" style="border-bottom:2px dotted var(--pre);border-radius:0;height:10px"></i>${t('lgPre')}</span>
    <span><i class="sw" style="background:var(--ink2);width:5px;height:5px"></i>${t('lgLogged')}</span>
    ${v.fertOn?`<span><i class="sw" style="background:var(--fertile);opacity:.45;border-radius:6px"></i>${t('lgFert')}</span><span><b style="color:var(--fertile);flex:0 0 auto">◎ ✦</b>${t('lgOv')}</span>`:''}
  </div>`;
  return `${header(t('tabCal'))}
  <div class="calhead"><button class="iconbtn" data-act="mon" data-v="-1" aria-label="${t('prevMonth')}">${I.left}</button><h3>${F.my.format(asDate(first))}</h3><button class="iconbtn" data-act="mon" data-v="1" aria-label="${t('nextMonth')}">${I.right}</button></div>
  <div class="wk">${t('wk').map(x=>`<span>${x}</span>`).join('')}</div>
  <div class="grid">${cells.join('')}</div>
  <p class="tiny muted" style="margin:10px 4px">${t('calTip')}</p>

}

function renderInsights(){
  const v = vm();
  if (!v.pred || v.pred.used.length<1) return `${header(t('tabIns'))}<div class="card"><h3>${t('insEmptyT')}</h3><p>${t('insEmptyB')}</p></div>`;
  const p = v.pred;
  const plens = v.starts.slice(0,-1).map(s=>periodDays(s).length).sort((a,b)=>a-b);
  const pmed = plens.length? plens[Math.floor(plens.length/2)] : '–';
  const spread = Math.max(1, Math.round((p.hiL-p.loL)/2));
  const W=320,H=150,L0=20,L1=36, x0=28, x1=W-8, y0=12, y1=H-22;
  const sy = L => y1 - (L-L0)/(L1-L0)*(y1-y0);
  const bars = p.lens.slice(-8); const bw = (x1-x0)/bars.length;
  const startsUsed = v.starts.slice(-bars.length-1);
  let svg = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('cycAria',bars.length,p.typLo,p.typHi,Math.min(...bars),Math.max(...bars))}">`;
  svg += `<rect x="${x0}" y="${sy(p.typHi)}" width="${x1-x0}" height="${sy(p.typLo)-sy(p.typHi)}" fill="var(--period)" fill-opacity=".09"/>`;
  [20,24,28,32,36].forEach(L=>{ svg+=`<line x1="${x0}" x2="${x1}" y1="${sy(L)}" y2="${sy(L)}" stroke="var(--line)" stroke-width="1"/><text x="${x0-6}" y="${sy(L)+3}" text-anchor="end">${L}</text>`; });
  bars.forEach((L,i)=>{ const x=x0+i*bw+bw*0.22, w=bw*0.56; svg+=`<rect x="${x}" y="${sy(L)}" width="${w}" height="${y1-sy(L)}" rx="4" fill="var(--period)" fill-opacity="${i===bars.length-1?1:.6}"/><text x="${x+w/2}" y="${sy(L)-4}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${L}</text><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${F.mon.format(asDate(startsUsed[i])).replace('.','')}</text>`; });
  svg += `</svg>`;
  const syms=['Cramps','Headache','Bloating','Tired','Breast tenderness','Acne','Back pain'];
  const rel=[-7,-6,-5,-4,-3,-2,-1,0,1,2,3,4];
  const pastStarts = v.starts.slice(1);
  const heat = syms.map(s => rel.map(r => { let h=0,n=0; pastStarts.forEach(st=>{ const l=S.logs.get(st+r); if (l && (l.nothingElse || l.symptoms.length || l.flow)) { n++; if (l.symptoms.includes(s)) h++; } }); return n? h/n : 0; }));
  const hm = `<div class="heat" style="grid-template-columns:104px repeat(${rel.length},minmax(0,1fr))" role="img" aria-label="${t('heatT')}">
    <span></span>${rel.map(r=>`<span class="h">${r===0?'P1':r>0?'+'+r:r}</span>`).join('')}
    ${syms.map((s,i)=>`<span class="r" title="${sym(s)}">${sym(s)}</span>${heat[i].map(x=>`<span class="c" style="opacity:${(0.06+x*0.94).toFixed(2)}" title="${Math.round(x*100)}%"></span>`).join('')}`).join('')}
  </div>`;
  let conceive='';
  if (v.fertOn && v.fert){
    const f=v.fert, b=f.bbt;
    if (b.length>=3){
      const Wt=320,Ht=150,tx0=34,tx1=Wt-8,ty0=14,ty1=Ht-22, T0=36.1,T1=36.9, n=Math.max(28,f.todayCd);
      const sx=cd=>tx0+(cd-1)/(n-1)*(tx1-tx0), syT=x=>ty1-(x-T0)/(T1-T0)*(ty1-ty0);
      let g=`<svg viewBox="0 0 ${Wt} ${Ht}" role="img" aria-label="${t('tempT')}">`;
      [36.2,36.4,36.6,36.8].forEach(T=>{ g+=`<line x1="${tx0}" x2="${tx1}" y1="${syT(T)}" y2="${syT(T)}" stroke="var(--line)"/><text x="${tx0-5}" y="${syT(T)+3}" text-anchor="end">${S.lang==='de'?T.toFixed(1).replace('.',','):T.toFixed(1)}</text>`; });
      if (f.shift) g+=`<line x1="${tx0}" x2="${tx1}" y1="${syT(f.shift.cover)}" y2="${syT(f.shift.cover)}" stroke="var(--fertile)" stroke-dasharray="4 3"/><text x="${tx1}" y="${syT(f.shift.cover)-4}" text-anchor="end" style="fill:var(--fertile)">${t('coverline')}</text>`;
      g+=`<polyline fill="none" stroke="var(--ink)" stroke-width="1.6" points="${b.map(x=>`${sx(x.cd)},${syT(x.v)}`).join(' ')}"/>`;
      b.forEach(x=>{ const hi=f.shift&&x.cd>=f.shift.cd; g+=`<circle cx="${sx(x.cd)}" cy="${syT(x.v)}" r="3" fill="${hi?'var(--fertile)':'var(--surface)'}" stroke="${hi?'var(--fertile)':'var(--ink)'}" stroke-width="1.5"/>`; });
      [1,7,14,21,28].filter(c=>c<=n).forEach(c=>{ g+=`<text x="${sx(c)}" y="${Ht-8}" text-anchor="middle">${S.lang==='de'?'ZT':'CD'} ${c}</text>`; });
      g+=`</svg>`;
      conceive += `<div class="card chart"><h3>${t('tempT')}</h3>${g}<p class="tiny">${f.shift?t('tempShift',f.shift.cd,md(f.dateOf(f.mapD))):t('tempNo')}</p></div>`;
    }
  }
  const hist = v.starts.slice(-7,-1).reverse().map(s=>{ const nx = v.starts[v.starts.indexOf(s)+1]; return `<div class="li"><div class="t"><b class="num" style="font-weight:700">${range(s,nx-1)}</b><span>${t('histRow',nx-s,periodDays(s).length)}</span></div>${I.chev}</div>`; }).join('');

    ${patternSection(v)}
    <div class="card chart"><h3>${t('cycleLen')}</h3>${svg}<p class="tiny">${t('bandNote')}</p></div>
    ${conceive}
    <div class="card"><h3>${t('heatT')}</h3><p class="tiny" style="margin-bottom:6px">${t('heatB')}</p>${hm}</div>
    <button class="card" data-act="push" data-v="report" style="text-align:left"><div class="row between"><h3>${t('reportT')}</h3>${I.chev}</div><p>${t('reportB')}</p></button>

function renderWhySheet(){

function renderRingSheet(){
  const v = vm(); if (!v.pred) return '';
  const p = v.pred, N = Math.max(p.hi - p.last + 1, v.cd + 2, 28), bleed = new Set(periodDays(p.last));
  const kinds = new Set(); for (let cd=1; cd<=N; cd++){ const day=p.last+cd-1, fd=v.fertOn&&v.fert?v.fert.days[cd-1]:null;
    kinds.add(bleed.has(day)?'bleed':(fd&&fd.tier>0)?'fert':(!v.paused&&day>=p.lo-7&&day<p.lo)?'pre':'rest'); }
  // swatch: a slice of the ring's top (ring units, 70 wide), drawn like the ring itself
  const arc=(r,a0,a1)=>{const q=a=>[35+r*Math.cos(a*Math.PI/180),147+r*Math.sin(a*Math.PI/180)];const[x0,y0]=q(a0),[x1,y1]=q(a1);return `M${x0} ${y0} A${r} ${r} 0 0 1 ${x1} ${y1}`;};
  const seg=(cols,dash)=>cols.map((c,i,a)=>{const per=28/a.length,a0=256+i*per+.9,a1=256+(i+1)*per-.9;return `<path d="${arc(118,a0,a1)}" stroke="${c[0]}" stroke-opacity="${c[1]}" stroke-width="18" fill="none" ${dash?'stroke-dasharray="2 3.2"':''}/>`;}).join('');
  const sw=x=>`<svg viewBox="0 0 70 45" aria-hidden="true">${x}</svg>`;

  const solid = v.fert && v.fert.status!=='predicted';

function renderPanel(){
  const pb = (attr,val,label,on) => `<button class="pbtn" ${attr}="${val}" aria-pressed="${on}">${label}</button>`;
  panel.innerHTML = `
    <div class="pgroup"><h1>${t('pTitle')}</h1><p>${t('pIntro')}</p></div>
    <div class="pgroup"><div class="plabel">${t('pLang')}</div><div class="pbtns">${pb('data-lang','de','Deutsch',S.lang==='de')}${pb('data-lang','en','English',S.lang==='en')}</div></div>
    <div class="pgroup"><div class="plabel">${t('pScen')}</div>
      <div class="pbtns">${['day12','expected','period','hbc','empty'].map(k=>pb('data-scen',k,t('sc_'+k),S.scen===k)).join('')}</div>
      <div class="pbtns">${['conceive','conceive2ww'].map(k=>pb('data-scen',k,t('sc_'+k),S.scen===k)).join('')}</div></div>
    <div class="pgroup"><div class="plabel">${t('pSim')}</div><div class="pbtns"><button class="pbtn" data-sim="onboarding">${t('simOnb')}</button><button class="pbtn" data-sim="lock">${t('simLock')}</button></div></div>
    <div class="pgroup"><div class="plabel">${t('pLook')}</div><div class="pbtns">${['system','light','dark'].map(k=>pb('data-theme-set',k,t('th'+k[0].toUpperCase()+k.slice(1)),S.theme===k)).join('')}</div></div>
    <div class="pgroup"><div class="plabel">${t('pTasks')}</div><ol class="tasks">${t('tasks').map(x=>`<li>${x}</li>`).join('')}</ol></div>
    <p class="pnote">${t('pNote')}</p>`;
}
panel.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.lang){ S.lang=b.dataset.lang; S.report.lang = S.lang==='de'?'DE':'EN'; setLocale(); }
  if (b.dataset.scen){ genScenario(b.dataset.scen); S.onb=null; S.lock=false; S.calMonth=[2026,11]; S.report.preview=false; }
  if (b.dataset.sim==='onboarding'){ genScenario('empty'); S.scen=null; S.onb={step:0,factors:[]}; }
  if (b.dataset.sim==='lock') S.lock=true;
  if (b.dataset.themeSet){ S.theme=b.dataset.themeSet; if (S.theme==='system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme=S.theme; }
  render(false);
});

/* ============ render ============ */
const app = document.getElementById('app');
function render(keepScroll=true){
  const keep = sel => { const el = app.querySelector(sel); return el ? el.scrollTop : 0; };
  const st = keep('.main'), sst = keep('.sheet .sheetbody'), pst = keep('.push .pushbody');
  const view = S.tab==='today'?renderToday():S.tab==='calendar'?renderCalendar():renderInsights();
  const sheet = {log:renderLogSheet, day:renderDaySheet, why:renderWhySheet, ring:renderRingSheet, method:renderMethodSheet, erase:renderEraseSheet}[S.layer];
  const push = {privacy:renderPrivacy, settings:renderSettings, report:renderReport}[S.push];
  app.innerHTML = `
  <div class="statusbar"><span class="num">9:41</span><span class="sb-icons" aria-hidden="true">
    <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg>
    <svg width="26" height="12" viewBox="0 0 26 12" fill="none"><rect x=".5" y=".5" width="22" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="17" height="8" rx="2" fill="currentColor"/><rect x="24" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".4"/></svg></span></div>
  <div class="main">${view}</div>
  <nav class="tabbar" aria-label="Tabs">
    ${[['today','tabToday',I.today],['calendar','tabCal',I.cal],['insights','tabIns',I.ins]].map(([k,l,ic])=>`<button class="tab" data-act="tab" data-v="${k}" ${S.tab===k?'aria-current="page"':''}>${ic}<span>${t(l)}</span></button>`).join('')}
  </nav>
  <button class="fab" data-act="openLog">${I.plus}${t('fab')}</button>
  <div class="push ${S.push?'open':''}" ${S.push?'':'aria-hidden="true"'}>${push?push():''}</div>
  <div class="layer ${S.layer?'open':''}"><div class="scrim" data-act="close"></div><div class="sheet" role="dialog" aria-modal="true">${sheet?sheet():''}</div></div>
  <div class="toast ${S.toast?'show':''}" role="status">${S.toast?`<span>${t(S.toast.msg)}</span>${S.toast.undo?`<button data-act="undo">${t('undo')}</button>`:''}`:''}</div>
  ${S.onb?renderOnb():''}${S.lock?renderLock():''}`;
  if (keepScroll){ const m=app.querySelector('.main'); if (m) m.scrollTop=st; const sb=app.querySelector('.sheet .sheetbody'); if (sb) sb.scrollTop=sst; const pb=app.querySelector('.push .pushbody'); if (pb) pb.scrollTop=pst; }
  fitRing();
  renderPanel();
}

/* ============ toast ============ */
let toastTimer=null;
function toast(msg, undo){ S.toast={msg, undo}; render(); clearTimeout(toastTimer); toastTimer=setTimeout(()=>{ S.toast=null; render(); }, undo?5000:2400); }

/* ============ actions ============ */
const snapshot = () => ({logs:new Map([...S.logs].map(([k,v])=>[k,structuredClone(v)])), overrides:new Map(S.overrides)});
const restore = s => () => { S.logs=s.logs; S.overrides=s.overrides; S.rev++; };
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, v = el.dataset.v;
  const edit = fn => { setLog(S.logDate, fn); S.lastChange=true; render(); };
  switch(a){
    case 'tab': S.tab=v; S.layer=null; render(false); try{ history.replaceState(null,'','#'+v); }catch(_){} break;
    case 'openLog': S.logDate=TODAY; S.layer='log'; render(); break;
    case 'close': S.layer=null; if (S.lastChange){ S.lastChange=null; toast('tSaved'); } else render(); break;
    case 'logDay': S.logDate=Math.min(TODAY, S.logDate+Number(v)); render(); break;
    case 'flow': edit(l=>{ l.flow = l.flow===v?undefined:v; }); break;
    case 'sym': edit(l=>{ l.symptoms = l.symptoms.includes(v)? l.symptoms.filter(x=>x!==v) : [...l.symptoms, v]; }); break;
    case 'emo': edit(l=>{ const e=l.emo||[]; l.emo = e.includes(v)? e.filter(x=>x!==v) : [...e, v]; }); break;
    case 'mute': S.muted.add(v); render(); break;
    case 'unmute': S.muted.clear(); render(); break;
    case 'tag': edit(l=>{ l.tags = l.tags.includes(v)? l.tags.filter(x=>x!==v) : [...l.tags, v]; }); break;
    case 'scale': edit(l=>{ const k=el.dataset.k, n=Number(v); l[k] = l[k]===n?undefined:n; }); break;
    case 'mucus': edit(l=>{ l.mucus = l.mucus===v?undefined:v; }); break;
    case 'logLh': edit(l=>{ l.lh = l.lh===v?undefined:v; }); break;
    case 'sex': edit(l=>{ l.sex = !l.sex; }); break;
    case 'nothing': edit(l=>{ l.nothingElse = !l.nothingElse; }); break;
    case 'region': S.painSel=v; render(); break;
    case 'bbt': edit(l=>{ const base = typeof l.bbt==='number'? l.bbt : 36.40; l.bbt = Math.round((base+Number(v))*100)/100; }); break;
    case 'quickFlow': { const s=snapshot(); setLog(TODAY, l=>{ l.flow=v; }); toast(v==='none'?'tEnded':'tFlow', restore(s)); break; }
    case 'periodStart': { const s=snapshot(); setLog(TODAY, l=>{ l.flow='medium'; }); if (!cycleStarts().includes(TODAY)) S.overrides.set(TODAY,'start'); toast('tPeriod', restore(s)); break; }
    case 'lh': { const s=snapshot(); setLog(TODAY, l=>{ l.lh = l.lh===v?undefined:v; }); toast(v==='pos'?'tLhPos':'tLh', restore(s)); break; }
    case 'undo': if (S.toast && S.toast.undo) S.toast.undo(); S.toast=null; clearTimeout(toastTimer); render(); break;
    case 'day': S.dayDetail=Number(v); S.layer='day'; render(); break;
    case 'editDay': S.logDate=Number(v); S.layer='log'; render(); break;
    case 'markStart': { const d=Number(v); const s=snapshot(); setLog(d, l=>{ if(!isBleed(l)) l.flow='medium'; }); S.overrides.set(d,'start'); S.layer=null; toast('tMarked', restore(s)); break; }
    case 'mon': { let [y,m]=S.calMonth; m+=Number(v); if (m<1){m=12;y--;} if (m>12){m=1;y++;} S.calMonth=[y,m]; render(false); break; }
    case 'sheet': S.layer=v; if (v==='erase') S.eraseText=''; render(); break;
    case 'push': S.push=v; S.layer=null; render(false); break;
    case 'pop': S.push=null; render(); break;
    case 'toggle': {
      const P=S.privacy;
      if (v.startsWith('hk.')) P.hk[v.slice(3)] = !P.hk[v.slice(3)];
      else if (v.startsWith('rinc.')) S.report.inc[v.slice(5)] = !S.report.inc[v.slice(5)];
      else if (v==='showFert') S.showFertTrack = !S.showFertTrack;
      else P[v] = !P[v];
      render(); break; }
    case 'mode': S.mode=v; render(); break;
    case 'lang': S.lang=v; S.report.lang = v==='de'?'DE':'EN'; setLocale(); render(); break;
    case 'episode': S.episode = ['hbc','preg','pp'].includes(v) ? {kind:v,start:TODAY} : null; if (['peri','pcos','endo','t'].includes(v)) toast('tCond'); else render(); break;
    case 'rRange': S.report.range=Number(v); render(); break;
    case 'rLang': S.report.lang=v; render(); break;
    case 'rPreview': S.report.preview=true; render(); break;
    case 'toast': toast(v); break;
    case 'doErase': genScenario('empty'); S.scen=null; S.onb={step:0,factors:[]}; render(false); break;
    case 'unlock': { const b=document.getElementById('unlockBtn'); if (b) b.textContent=t('recognizing'); setTimeout(()=>{ S.lock=false; render(); }, 650); break; }
    case 'onbNext': {
      const from = S.onb.step;
      if (from===4 && v!=='unknown'){ const val=(document.getElementById('lastp')||{}).value; if (val){ const [yy,mm,dd]=val.split('-').map(Number); const d0=D(yy,mm,dd); for (let k=0;k<5;k++) if (d0+k<=TODAY) setLog(d0+k, l=>{ l.flow=['medium','heavy','medium','light','light'][k]; }); } }
      S.onb.step = from+1; render(false); break; }
    case 'onbAgree': S.consentAt = Date.now(); S.onb.step = 3; render(false); break;
    case 'onbImport':
      S.onb.importing=true; render(false);
      requestAnimationFrame(()=>requestAnimationFrame(()=>{ const b=document.getElementById('ibar'); if (b) b.style.width='100%'; }));
      setTimeout(()=>{ const m=document.getElementById('imsg'); if (m) m.textContent=t('found'); }, 700);
      setTimeout(()=>{ const f=S.onb.factors; genScenario('day12'); S.scen=null; S.onb={step:5, factors:f, imported:true}; render(false); }, 1500);
      break;
    case 'onbFactor': { const f=S.onb.factors; S.onb.factors = v==='ep_none' ? (f.includes(v)?[]:[v]) : (f.includes(v)? f.filter(x=>x!==v) : [...f.filter(x=>x!=='ep_none'), v]); render(false); break; }
    case 'onbDone': { const f=S.onb.factors; S.privacy.appLock = v==='lock';
      if (f.includes('f_conceive')) S.mode='conceive';
      const epk = ['hbc','preg','pp'].find(k=>f.includes('ep_'+k)); if (epk) S.episode={kind:epk,start:TODAY};
      S.onb=null; S.tab='today'; render(false); break; }
  }
});
app.addEventListener('input', e => {
  const x = e.target;
  if (x.id==='pain'){ setLog(S.logDate, l=>{ l.pain[S.painSel]=Number(x.value); if(!l.pain[S.painSel]) delete l.pain[S.painSel]; }); S.lastChange=true; render(); const n=document.getElementById('pain'); if(n) n.focus(); }
  if (x.id==='note'){ setLog(S.logDate, l=>{ l.note=x.value; }); S.lastChange=true; }
  if (x.id==='rq'){ S.report.questions=x.value; }
  if (x.id==='erase'){ S.eraseText=x.value; const b=app.querySelector('[data-act="doErase"]'); const ok=x.value.trim().toUpperCase()===t('eraseWord'); if (b){ b.disabled=!ok; b.style.opacity=ok?1:.4; } }
});
app.addEventListener('change', e => {
  const x = e.target;
  if (x.id==='bbt'){ const n=parseFloat(x.value.replace(',','.')); setLog(S.logDate, l=>{ if (isNaN(n)) delete l.bbt; else l.bbt=Math.round(n*100)/100; }); S.lastChange=true; render(); }
});
app.addEventListener('keydown', e => {
  if ((e.key==='Enter'||e.key===' ') && e.target.classList && e.target.classList.contains('region')){ e.preventDefault(); S.painSel=e.target.dataset.v; render(); }
  if (e.key==='Escape' && S.layer){ S.layer=null; render(); }
});
window.addEventListener('resize', fitRing);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitRing);

/* ============ boot ============ */
setLocale();
genScenario('day12');
try { window.__cyclus = {S, vm, predict, fertility, trail, genScenario, render, t, patternWatch, forecast, learn:()=>LEARN}; } catch(_){}
const h = (location.hash||'').slice(1);
if (['today','calendar','insights'].includes(h)) S.tab=h;
render(false);
})();
</script>
